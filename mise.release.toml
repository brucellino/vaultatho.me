[tools]
node = "24"
npm = "12.0.2"

[tasks.release_deps]
run = "npm install -g semantic-release@25.0.9 '@semantic-release/commit-analyzer@13.0.1' '@semantic-release/release-notes-generator@14.1.1' '@semantic-release/changelog@7.0.0' '@semantic-release/git@11.0.1' '@semantic-release/github@12.0.0'"

[tasks.release]
depends = ["release_deps"]
run = "npx semantic-release"
