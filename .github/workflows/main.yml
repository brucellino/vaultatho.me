name: Release
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  actions: read
  contents: write
  deployments: none
  packages: write
  pages: none
  pull-requests: write
  security-events: write
  statuses: write
  id-token: write

jobs:
  vpn:
    name: setup Tailscale
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          ping: sense.orca-ordinal.ts.net

  validate:
    name: Test
    # needs: [vpn]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create dev env with jdx mise action
        uses: jdx/mise-action@v3
        with:
          install: true
          experimental: true
      - name: init terraform
        run: terraform init --backend=false
      - name: validate terraform
        run: terraform validate

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        # We test the latest releases of each major,
        # plus necessary legacy versions depending on hardware.
        vault_version:
          - 1.21.4 # latest v1
          - 2.1.0
        nomad_version:
          - 1.11.3
          - 2.0.5
        consul_version:
          - 1.17.3 # latest ARMv7
          - 1.22.7 # latest v1
          - 2.0.3 # latest v2
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create dev env with jdx mise action
        uses: jdx/mise-action@v3
        with:
          install: true
          experimental: true
      - name: Get Tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh
      - name: Start tailscale
        run: sudo tailscale up --authkey "${TAILSCALE_AUTHKEY}"
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Get Consul
        run: |
          wget https://releases.hashicorp.com/consul/${{ matrix.consul_version }}/consul_${{ matrix.consul_version }}_linux_amd64.zip
          unzip -o consul_${{ matrix.consul_version }}_linux_amd64.zip
          mv consul ~/consul
      - name: Get Nomad
        run: |
          wget https://releases.hashicorp.com/nomad/${{ matrix.nomad_version }}/nomad_${{ matrix.nomad_version }}_linux_amd64.zip
          unzip -o nomad_${{ matrix.nomad_version }}_linux_amd64.zip
          mv nomad ~/nomad
      - name: Get Vault
        run: |
          wget https://releases.hashicorp.com/vault/${{ matrix.vault_version }}/vault_${{ matrix.vault_version }}_linux_amd64.zip
          unzip -o vault_${{ matrix.vault_version }}_linux_amd64.zip
          mv vault ~/vault
      - name: Make vault, nomad and consul executable
        run: chmod +x ~/vault ~/consul ~/nomad
      - name: Start Consul dev server
        run: ~/consul agent -dev &
      # - name: Bootstrap consul ACL
      #   run: ~/consul acl bootstrap -format=json
      - name: Start Nomad server
        run: ~/nomad agent -dev -acl-enabled -bootstrap-expect=1 &
      - name: Bootstrap Nomad ACL
        run: ~/nomad acl bootstrap -json > nomad_acl.json
      - name: Start Vault dev server
        run: ~/vault server -dev &
      - name: init terraform
        run: terraform init
      - name: Plan
        run: |
          TF_VAR_nomad_mgmt_token=$(cat nomad_acl.json| jq -r .SecretID) \
          VAULT_TOKEN=$(cat ~/.vault-token) \
          TF_VAR_vault_addr=http://localhost:8200 \
          TF_VAR_consul_token=${{ secrets.CONSUL_TOKEN }} \
          terraform plan
      # - name: stop Vault
      #   run: kill -9 $(jobs -p)
  release:
    needs: [apply]
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/iron"
      - name: Install dependencies
        run: |
          npm install -g \
            semantic-release \
            '@semantic-release/changelog' \
            '@semantic-release/github' \
            '@semantic-release/changelog' \
            '@semantic-release/git'
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
